spring:
  application:
    name: goldPrice

  data:
    redis:
      host: 192.168.98.27
      port: 6379
      client-type: jedis

  cache:
    type: redis


  datasource:
    url: jdbc:h2:file:./data/demo
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org:
      springframework:
        cache: TRACE

